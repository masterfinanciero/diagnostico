<style>
/* Plan vertical por fases. Tres colores = tres bolsillos: azul fondo, verde DCA, cobre patrimonio */
:root{--bg:#f3f5f8;--panel:#fff;--ink:#121a26;--mute:#5a6678;--line:#dbe1ea;--acc:#0e8a75;--soft:#e3f5f1;--good:#1d7a4c;--bad:#b13838;--warn:#b5770b;--hero:#0f1b33;--gsoft:#e4f3ea;--bsoft:#f8e5e5;--wsoft:#f6eedc;
--fon:#3b5e8c;--fon-s:#e2e9f3;--dca:#1d7a4c;--dca-s:#e4f3ea;--pat:#a5522c;--pat-s:#f6e7de;
--fd:"Archivo",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--soft:#163330;--good:#52c48c;--bad:#ef7d7d;--warn:#e9b44c;--hero:#0a1322;--gsoft:#16301f;--bsoft:#3a1c1c;--wsoft:#2d2516;
--fon:#8fb1de;--fon-s:#1c2a3d;--dca:#5cc995;--dca-s:#15301f;--pat:#e8a07a;--pat-s:#3a2419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--soft:#163330;--good:#52c48c;--bad:#ef7d7d;--warn:#e9b44c;--hero:#0a1322;--gsoft:#16301f;--bsoft:#3a1c1c;--wsoft:#2d2516;
--fon:#8fb1de;--fon-s:#1c2a3d;--dca:#5cc995;--dca-s:#15301f;--pat:#e8a07a;--pat-s:#3a2419;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
img{max-width:100%}[hidden]{display:none!important}
.in{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hero);color:#f2f5fa}header .in{padding-block:20px;display:flex;gap:14px;align-items:center}
.logo{width:60px;background:#fff;border-radius:12px;padding:6px;flex:none}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}h1{font-size:23px}h2{font-size:19px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-family:var(--fm);font-weight:500;margin-top:4px}
header p{margin:2px 0 0;opacity:.75;font-size:13.5px}
.modo{margin-left:auto;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 11px;white-space:nowrap}
nav.tabs{background:var(--hero);position:sticky;top:0;z-index:5}nav.tabs .in{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px}
nav.tabs button{font:inherit;font-weight:600;font-size:14px;color:#c9d3e2;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:var(--acc)}
main.in{padding-block:18px 60px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.card.k-fon{border-top:4px solid var(--fon)}.card.k-dca{border-top:4px solid var(--dca)}.card.k-pat{border-top:4px solid var(--pat)}.card.k-fin{border-top:4px solid var(--ink)}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ch .t{font-family:var(--fm);font-weight:600}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0;max-width:68ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:5px;font-weight:500;font-size:14px;min-width:0}
label.f small{color:var(--mute);font-weight:400;font-size:12px;font-family:var(--fm)}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
input[type=number]{font-family:var(--fm)}
textarea{font-family:var(--fm);font-size:12.5px;min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.val{font-family:var(--fm);font-weight:600;padding:4px 0}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wa{background:#1f9d55;border-color:#1f9d55}
.x{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;padding:4px 6px;font-size:14px}
.note{font-size:13px;color:var(--mute);margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;background:var(--bg)}
.kpi span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-family:var(--fm);font-size:17px;font-weight:500}
.kpi.bad{background:var(--bsoft)}.kpi.bad b{color:var(--bad)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--fm)}
td input,td select{padding:6px 8px}
td input[type=number]{width:76px;text-align:right}
.t-dca{min-width:760px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--gsoft);color:var(--good)}.c-w{background:var(--wsoft);color:var(--warn)}.c-b{background:var(--bsoft);color:var(--bad)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.t-ess{background:var(--fon-s);color:var(--fon)}.t-gus{background:var(--wsoft);color:var(--warn)}
.banner{border-radius:12px;padding:12px 14px;background:var(--soft);border:1.5px solid var(--acc);font-size:14px;display:grid;gap:8px}
.banner.w{background:var(--wsoft);border-color:var(--warn)}
.hero-n{font-family:var(--fd);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px var(--fm);white-space:nowrap;overflow:hidden;min-width:0;transition:width .3s}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.legend div{border-left:4px solid;padding:2px 0 2px 10px;min-width:0}
.legend small{display:block;font-size:12px;color:var(--mute)}
.legend b{font-family:var(--fm);font-size:16px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.step small{font-family:var(--fm);font-size:11.5px;color:var(--mute)}
.step b{font-size:14px;line-height:1.2}
.step span{font-size:12px;font-weight:600;color:var(--mute)}
.step.ok{background:var(--gsoft);border-color:transparent}.step.ok span{color:var(--good)}
.rule{border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600}
.r-fon{background:var(--fon-s);color:var(--fon)}.r-dca{background:var(--dca-s);color:var(--dca)}.r-pat{background:var(--pat-s);color:var(--pat)}
.chk{font-size:13px;font-weight:600;margin:0}
.cat{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.cat-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat-h b{font-size:15px}
.cat-h .t{font-family:var(--fm);font-weight:600}
.it{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 30px;gap:8px;align-items:center}
.it .m{grid-column:2/4;font-family:var(--fm);font-size:12px;color:var(--mute);margin-top:-4px}
.debt{display:grid;grid-template-columns:minmax(0,1fr) 140px 130px 80px 30px;gap:8px;align-items:center}
.debt.h{font-size:12px;color:var(--mute)}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13.5px}
.hb .tr{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%}
.hb .v{font-family:var(--fm);text-align:right}
.r503{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.r5{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.r5 small{display:block;font-size:12px;color:var(--mute)}
.r5 b{font-family:var(--fm);font-size:22px;font-weight:600}
.r5 div{font-size:12.5px;font-weight:600}
.health{display:grid;gap:6px}
.health div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(1px)}
.asset{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rung{background:var(--pat-s);border-radius:8px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.rung small{font-family:var(--fm);font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.rung .r2{display:flex;gap:6px;align-items:center;font-size:13px}
.rung .r2 input{padding:4px 6px}
.rung .amt{font-family:var(--fm);font-size:12.5px;color:var(--pat);font-weight:600}
.chart{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding:4px 6px 0}
.lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
ol.reglas{margin:0;padding-left:22px;display:grid;gap:8px}
ol.reglas b{font-family:var(--fm);font-weight:600}
.share{display:grid;gap:10px}
.share input{font-family:var(--fm);font-size:12.5px}
footer{color:var(--mute);font-size:12.5px;text-align:center;padding:10px 0 30px}
footer a{color:inherit}
@media (max-width:640px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legend,.r503{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .it{grid-template-columns:minmax(0,1fr) 120px}
  .it select{grid-column:1}
  .it .m{grid-column:1/-1}
  .debt{grid-template-columns:1fr 1fr}
  .debt.h{display:none}
  .hb{grid-template-columns:100px minmax(0,1fr) 96px}
  .modo{display:none}
  .hero-n{font-size:32px}
}
@media (prefers-reduced-motion:reduce){.split div{transition:none}}
@media print{nav.tabs,.noprint,.btn,.x{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="in"><img class="logo" alt="MASFIN" src="../img/masfin-logo.png"><div><h1>Plan Patrimonial MASFIN</h1><p>Sus finanzas, su fondo de emergencia y sus dos portafolios · De Cero a Capo</p></div><span class="modo" id="modo"></span></div></header>
<nav class="tabs"><div class="in" id="tabs"><button data-t="fin" class="on">1 · Mis finanzas</button><button data-t="plan">2 · Mi plan</button><button data-t="env" id="tabEnv">3 · Enviar</button></div></nav>
<main class="in" id="app"></main>
<footer class="in">MASFIN · De Cero a Capo · Herramienta educativa: los rendimientos son supuestos, no promesas. Sus datos se guardan solo en este dispositivo.</footer>

<script>
(function(){
const PROFE=/[?&]profesor\b/.test(location.search);
const WA="573332581129";
const LS_F="masfin_plan_finanzas_v1", LS_P="masfin_plan_plan_v1";
const BASE=location.origin+location.pathname;

/* ---------- datos ---------- */
const CATS=[
 {k:"vivienda",n:"Vivienda",ess:1,sug:["Arriendo o cuota de vivienda","Administración","Servicios públicos","Internet y celular"]},
 {k:"alimentacion",n:"Alimentación",ess:1,sug:["Mercado"]},
 {k:"transporte",n:"Transporte",ess:1,sug:["Gasolina o pasajes","Mantenimiento","SOAT y técnico-mecánica"]},
 {k:"salud",n:"Salud",ess:1,sug:["Salud prepagada o complementaria","Medicamentos"]},
 {k:"educacion",n:"Educación",ess:1,sug:["Colegio, universidad o cursos"]},
 {k:"familia",n:"Familia y personas a cargo",ess:1,sug:["Aporte a padres","Gastos de hijos"]},
 {k:"seguros",n:"Seguros",ess:1,sug:["Seguro de vida"]},
 {k:"gustos",n:"Gustos y salidas",ess:0,sug:["Restaurantes y domicilios","Salidas y planes","Viajes"]},
 {k:"suscripciones",n:"Suscripciones",ess:0,sug:["Streaming y apps","Gimnasio"]},
 {k:"personal",n:"Cuidado personal y ropa",ess:0,sug:["Ropa","Peluquería y cuidado"]},
 {k:"otros",n:"Otros",ess:0,sug:["Imprevistos y varios"]}
];
const ANUAL=/^(SOAT|Viajes|Ropa)/;
const ACTIVOS=[["emergencia","Ahorro disponible para emergencias"],["inversiones","Inversiones actuales"],["vivienda","Vivienda (valor comercial)"],["vehiculo","Vehículo"],["otros","Otros activos"]];
const FREQ=[["mensual","Mensual"],["quincenal","Quincenal"],["semanal","Semanal"],["anual","Anual"]];
const HIST={
  sp:{n:"S&P 500",c:[["Puntocom 2000–2002",49],["Gran Crisis 2007–2009",57],["Pandemia 2020",34],["Inflación 2022",25]]},
  nq:{n:"Nasdaq 100",c:[["Puntocom 2000–2002",83],["Gran Crisis 2007–2009",54],["Pandemia 2020",28],["Inflación 2022",35]]},
  btc:{n:"Bitcoin",c:[["2014–2015",85],["2018",84],["Pandemia 2020",63],["2022",77]]},
  oro:{n:"Oro",c:[["2008",33],["2011–2015",45],["Pandemia 2020",12],["2022",21]]},
  otro:{n:"Otro",c:[]}
};
const REFS=[["sp","S&P 500"],["nq","Nasdaq 100"],["btc","Bitcoin"],["oro","Oro"],["otro","Otro (sin historial)"]];

function finVacias(){const g={};CATS.forEach(c=>g[c.k]=c.sug.map(s=>({c:s,m:"",f:ANUAL.test(s)?"anual":"mensual"})));
  return {t:0,ingresos:[{c:"Salario",m:"",f:"mensual"}],gastos:g,deudas:[],activos:{emergencia:"",inversiones:"",vivienda:"",vehiculo:"",otros:""}};}
function planBase(){return {base:true,t:0,alumno:{nombre:"",objetivo:"Construir patrimonio en dólares y estar listo para la próxima crisis",inicio:mesActual()},
  fin:{invertir:"",dia:5},reparto:{modo:"auto",fondo:50,dca:30,crisis:20},fondo:{meses:6,lugar:"Cuenta de ahorro de alto rendimiento o fondo de liquidez"},trm:3900,
  dca:{frecuencia:"mensual",rent:8,activos:[{nombre:"S&P 500",ticker:"VOO",tipo:"ETF",pct:70,score:"",estado:"aprobado",tesis:"Las 500 empresas más grandes de EE. UU. Núcleo del portafolio."},{nombre:"Nasdaq 100",ticker:"QQQM",tipo:"ETF",pct:30,score:"",estado:"aprobado",tesis:"Tecnología y crecimiento. Más volátil que el S&P."}]},
  crisis:{lugar:"CDT a 90 días renovable o fondo de liquidez",rent:8,activos:[{nombre:"S&P 500",ticker:"VOO",ref:"sp",pct:60,niveles:[[10,20],[20,30],[30,30],[40,20]]},{nombre:"Nasdaq 100",ticker:"QQQM",ref:"nq",pct:25,niveles:[[15,20],[25,30],[35,30],[50,20]]},{nombre:"Bitcoin",ticker:"BTC",ref:"btc",pct:15,niveles:[[40,20],[55,30],[70,30],[80,20]]}]},
  notas:""};}
function mesActual(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}

let F=load(LS_F)||finVacias(), P=load(LS_P)||planBase(), TAB="fin", MSG="";
function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS_F,JSON.stringify(F));localStorage.setItem(LS_P,JSON.stringify(P))}catch(e){}}

/* ---------- utilidades ---------- */
const cop=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
const usd=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const N=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const $=n=>cop.format(Math.round(n||0));
const $u=n=>usd.format(Math.round((n||0)/(N(P.trm)||1)));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc=(a,b)=>b?Math.round(a/b*100):0;
const getIn=(o,p)=>p.split(".").reduce((x,k)=>x==null?x:x[k],o);
function setIn(o,p,v){const ks=p.split(".");for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
const opts=(o,v)=>o.map(([k,t])=>`<option value="${k}"${k==v?" selected":""}>${esc(t)}</option>`).join("");

/* campos del plan: editables solo para el profesor */
function pf(label,p,kind,o={}){
  const v=getIn(P,p);let c;
  if(PROFE){
    if(kind==="sel")c=`<select data-p="${p}" data-full="1">${opts(o.opts,v)}</select>`;
    else if(kind==="txt")c=`<input type="text" data-p="${p}" value="${esc(v)}">`;
    else c=`<input type="number" step="any" inputmode="decimal" data-p="${p}" data-num="1" value="${esc(v)}"${o.ph?` placeholder="${esc(o.ph)}"`:""}>`;
  }else{
    let s=v;if(kind==="sel")s=(o.opts.find(([k])=>k==v)||[,v])[1];else if(kind==="money")s=$(v===""&&o.ph?o.ph:v);else if(o.suf)s=v+o.suf;
    c=`<div class="val">${esc(s)||"—"}</div>`;
  }
  const h=o.help!=null?`<small>${o.help}</small>`:(kind==="money"&&PROFE?`<small data-fmt="${p}">${$(v)}</small>`:"");
  return `<label class="f">${label}${c}${h}</label>`;
}
function pc_(p,kind,o={}){
  const v=getIn(P,p);
  if(!PROFE){if(kind==="sel")return esc((o.opts.find(([k])=>k==v)||[,v])[1]);return esc(v)+(o.suf&&v!==""?o.suf:"")}
  if(kind==="sel")return `<select data-p="${p}" data-full="1">${opts(o.opts,v)}</select>`;
  if(kind==="txt")return `<input type="text" data-p="${p}" value="${esc(v)}"${o.w?` style="width:${o.w}"`:""}>`;
  return `<input type="number" step="any" inputmode="decimal" data-p="${p}" data-num="1" value="${esc(v)}">`;
}
/* campos de finanzas: editables para todos */
function ff(p,kind,o={}){
  const v=getIn(F,p);
  if(kind==="sel")return `<select data-fp="${p}" data-full="1" aria-label="Frecuencia">${opts(o.opts,v)}</select>`;
  if(kind==="txt")return `<input type="text" data-fp="${p}" value="${esc(v)}" placeholder="${esc(o.ph||"Concepto")}" aria-label="Concepto">`;
  return `<input type="number" step="any" min="0" inputmode="decimal" data-fp="${p}" data-num="1" value="${esc(v)}" placeholder="${esc(o.ph||"$ 0")}" aria-label="${esc(o.aria||"Monto")}">`;
}

/* ---------- cálculos ---------- */
const mens=it=>{const m=N(it.m);return it.f==="anual"?m/12:it.f==="quincenal"?m*2:it.f==="semanal"?m*52/12:m};
function finCalc(){
  const o={ingreso:0,cats:{},ess:0,gus:0,cuotas:0,gastos:0,sobrante:0,emer:0,activos:0,saldo:0,neto:0,caras:[]};
  o.ingreso=(F.ingresos||[]).reduce((s,i)=>s+mens(i),0);
  CATS.forEach(c=>{const t=((F.gastos||{})[c.k]||[]).reduce((s,i)=>s+mens(i),0);o.cats[c.k]=t;if(c.ess)o.ess+=t;else o.gus+=t});
  o.cuotas=(F.deudas||[]).reduce((s,d)=>s+N(d.cuota),0);
  o.ess+=o.cuotas;o.gastos=o.ess+o.gus;o.sobrante=o.ingreso-o.gastos;
  const A=F.activos||{};o.emer=N(A.emergencia);o.activos=ACTIVOS.reduce((s,[k])=>s+N(A[k]),0);
  o.saldo=(F.deudas||[]).reduce((s,d)=>s+N(d.saldo),0);o.neto=o.activos-o.saldo;
  o.caras=(F.deudas||[]).filter(d=>N(d.tasa)>=25&&N(d.saldo)>0);
  return o;
}
function calc(){
  const FC=finCalc();
  const rec=Math.max(0,Math.floor(FC.sobrante*0.9/10000)*10000);
  const inv=(P.fin.invertir===""||P.fin.invertir==null)?rec:N(P.fin.invertir);
  const meses=N(P.fondo.meses), meta=meses*FC.ess, falta=Math.max(0,meta-FC.emer), lleno=meta>0&&falta<=0;
  const cob=FC.ess?FC.emer/FC.ess:0;
  let auto,why;
  if(lleno){auto={fondo:0,dca:65,crisis:35};why=`El fondo ya cubre ${cob.toFixed(1)} meses de gastos esenciales: está completo. Todo va a los portafolios.`}
  else if(cob<1){auto={fondo:60,dca:25,crisis:15};why=`Tiene ${cob.toFixed(1)} meses de gastos esenciales guardados. Primero el colchón: la mayor parte va al fondo.`}
  else if(cob<meses/2){auto={fondo:50,dca:30,crisis:20};why=`Tiene ${cob.toFixed(1)} de ${meses} meses cubiertos. El fondo sigue siendo prioridad, pero ya arranca a construir.`}
  else{auto={fondo:35,dca:40,crisis:25};why=`Ya cubre ${cob.toFixed(1)} de ${meses} meses. Se acelera la inversión mientras termina el fondo.`}
  const modo=P.reparto.modo==="manual"?"manual":"auto";
  const man={fondo:N(P.reparto.fondo),dca:N(P.reparto.dca),crisis:N(P.reparto.crisis)};
  const r1=modo==="auto"?auto:man;
  const sh=(r1.dca+r1.crisis)>0?r1.dca/(r1.dca+r1.crisis):0.5;
  const r2=modo==="auto"?{fondo:0,dca:65,crisis:35}:{fondo:0,dca:Math.round(sh*100),crisis:100-Math.round(sh*100)};
  const rsum=r1.fondo+r1.dca+r1.crisis;
  const f1={fondo:inv*r1.fondo/100,dca:inv*r1.dca/100,crisis:inv*r1.crisis/100};
  const f2={fondo:0,dca:inv*r2.dca/100,crisis:inv*r2.crisis/100};
  const sh2=r2.dca/100;
  const mf=lleno?0:(f1.fondo>0?Math.ceil(falta/f1.fondo):Infinity);
  const mr=x=>Math.pow(1+N(x)/100,1/12)-1, rD=mr(P.dca.rent), rC=mr(P.crisis.rent);
  let fondo=FC.emer,dV=0,dA=0,pol=0;const Y=[{y:0,dV:0,dA:0,pol:0}],at={};
  for(let m=1;m<=120;m++){
    const need=Math.max(0,meta-fondo);let ad,ac;
    if(need>0){const af=Math.min(f1.fondo,need),ex=f1.fondo-af;fondo+=af;ad=f1.dca+ex*sh2;ac=f1.crisis+ex*(1-sh2)}else{ad=f2.dca;ac=f2.crisis}
    dV=dV*(1+rD)+ad;dA+=ad;pol=pol*(1+rC)+ac;
    if(m%12===0)Y.push({y:m/12,dV,dA,pol});
    if(m===12||m===24||m===36)at[m]=pol;
  }
  const act=P.dca.activos, ok=act.filter(a=>a.estado==="aprobado");
  const pAll=act.reduce((s,a)=>s+N(a.pct),0), pOk=ok.reduce((s,a)=>s+N(a.pct),0);
  const perBuy=P.dca.frecuencia==="semanal"?52/12:P.dca.frecuencia==="quincenal"?2:1;
  const cr=P.crisis.activos, crP=cr.reduce((s,a)=>s+N(a.pct),0);
  const ladOk=cr.every(a=>a.niveles.reduce((s,l)=>s+N(l[1]),0)===100);
  const steps=[FC.ingreso>0&&FC.gastos>0&&inv>0&&inv<=Math.max(0,FC.sobrante)&&rsum===100, meses>0&&!!String(P.fondo.lugar).trim()&&FC.ess>0, ok.length>0&&pAll===100&&pOk>0, cr.length>0&&crP===100&&ladOk&&!!String(P.crisis.lugar).trim()];
  return {FC,rec,inv,modo,auto,why,r1,r2,rsum,meta,falta,lleno,cob,mf,f1,f2,Y,at,act,ok,pAll,pOk,perBuy,cr,crP,steps,last:Y[Y.length-1]};
}
function fecha(m){const [y,mm]=(P.alumno.inicio||mesActual()).split("-").map(Number);return new Date(y,(mm||1)-1+m,1).toLocaleDateString("es-CO",{month:"long",year:"numeric"})}

function chart(Y){
  const W=640,H=230,L=70,R=14,T=14,B=30;
  const mx=Math.max(1,...Y.map(y=>Math.max(y.dV,y.pol,y.dA)));
  const p=Math.pow(10,Math.floor(Math.log10(mx))),nice=[1,2,2.5,5,10].find(k=>k*p>=mx)*p;
  const x=i=>L+(W-L-R)*i/(Y.length-1),y=v=>T+(H-T-B)*(1-v/nice);
  const line=(k,c,d)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" ${d?'stroke-dasharray="5 4"':""} points="${Y.map((q,i)=>x(i)+","+y(q[k])).join(" ")}"/>`;
  const sh=v=>v>=1e9?(v/1e9).toFixed(1).replace(".0","")+" mil M":v>=1e6?Math.round(v/1e6)+" M":Math.round(v/1e3)+" mil";
  let g="";for(let k=0;k<=4;k++){const v=nice*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)" font-family="IBM Plex Mono,monospace">$${sh(v)}</text>`}
  Y.forEach((q,i)=>{if(i%2===0)g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mute)" font-family="IBM Plex Mono,monospace">Año ${q.y}</text>`});
  const l=Y[Y.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección a 10 años del DCA y la pólvora seca">${g}${line("dA","var(--mute)",1)}${line("pol","var(--pat)")}${line("dV","var(--dca)")}<circle cx="${x(Y.length-1)}" cy="${y(l.dV)}" r="4" fill="var(--dca)"/><circle cx="${x(Y.length-1)}" cy="${y(l.pol)}" r="4" fill="var(--pat)"/></svg>`;
}

/* compresión para links cortos */
const b64u=b=>{let s="";const a=new Uint8Array(b);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const ub64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const s=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64u(await new Response(s).arrayBuffer())}catch(e){}}
  return "j"+b64u(raw);
}
async function unpack(str){
  str=str.trim();const t=str[0],body=ub64u(str.slice(1));
  if(t==="z"){const s=new Blob([body]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(s).text())}
  if(t==="j")return JSON.parse(new TextDecoder().decode(body));
  throw new Error("formato");
}
function limpia(o){return JSON.parse(JSON.stringify(o))}

async function genLink(){

    const txt=`Hola${P.alumno.nombre?" "+P.alumno.nombre.split(" ")[0]:""}, aquí está su Plan Patrimonial MASFIN. Ábralo y guárdelo:\n${LINK}`;
    document.getElementById("waLink").href=`https://wa.me/${tel?(tel.length===10?"57"+tel:tel):""}?text=${encodeURIComponent(txt)}`;
    msg.textContent=LINK.length>3500?"Link listo (es largo porque trae muchos datos; WhatsApp lo envía sin problema).":"Link listo.";
  }catch(e){msg.textContent="No pude generar el link en este navegador. Pruebe con Chrome."}
}
async function envMsg(){
  const nom=(document.getElementById("miNom").value||"").trim();
  if(nom&&!P.alumno.nombre){P.alumno.nombre=nom;save()}
  F.t=Date.now();save();

}

/* ---------- eventos ---------- */
function rerender(){
  const a=document.activeElement,key=a&&a.dataset&&(a.dataset.p?"data-p":a.dataset.fp?"data-fp":null),val=key&&a.getAttribute(key),ss=a&&a.selectionStart;
  render();
  if(key){const n=document.querySelector(`[${key}="${val}"]`);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,ss)}catch(_){}}}
}
let rT=null;const later=()=>{clearTimeout(rT);rT=setTimeout(rerender,500)};
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;render();window.scrollTo(0,0)});
document.addEventListener("input",e=>{
  const d=e.target.dataset||{};const v=d.num?(e.target.value===""?"":N(e.target.value)):e.target.value;

  else if(d.fp){setIn(F,d.fp,v);F.t=Date.now();save();if(!d.full){const fm=document.querySelector(`[data-ffmt="${d.fp}"]`);if(fm)fm.textContent=$(getIn(F,d.fp));later()}}
});
document.addEventListener("change",e=>{
  const d=e.target.dataset||{};if(!d.full)return;

  else if(d.fp){setIn(F,d.fp,e.target.value);F.t=Date.now();save();rerender()}
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.go){TAB=t.dataset.go;render();window.scrollTo(0,0);return}
  if(t.dataset.fadd){const k=t.dataset.fadd;if(k==="deudas")F.deudas.push({c:"",saldo:"",cuota:"",tasa:""});else getIn(F,k).push({c:"",m:"",f:"mensual"});save();rerender();return}

  if(t.dataset.del&&PROFE){if(t.dataset.armed!=="1"){t.dataset.armed="1";const o=t.textContent;t.textContent="¿Quitar?";setTimeout(()=>{t.dataset.armed="";t.textContent=o},2500);return}const [k,i]=t.dataset.del.split(".");P[k].activos.splice(+i,1);save();rerender();return}

    try{const o=await unpack(mm[1]);if(!o.f)throw 0;F=o.f;if(o.n)P.alumno.nombre=o.n;save();out.textContent="Finanzas cargadas"+(o.n?" de "+o.n:"")+".";setTimeout(()=>{TAB="fin";render();window.scrollTo(0,0)},700)}
    catch(x){out.textContent="Ese código está incompleto. Pídale al alumno que lo envíe otra vez."}return}
  if(t.id==="nuevo"){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Toque otra vez para borrar";setTimeout(()=>{t.dataset.armed="";t.textContent="Nuevo alumno"},3000);return}
    F=finVacias();P=planBase();P.base=false;save();TAB="fin";render();return}
});
function copiar(txt,btn,ok,box){
  const o=btn.textContent;const done=()=>{btn.textContent=ok;setTimeout(()=>btn.textContent=o,1800)};
  const fb=()=>{const b=box||document.getElementById("linkOut");if(b){b.hidden=false;b.value=txt;b.select();btn.textContent="Copie con Ctrl+C"}};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
}

async function desdeLink(){
  const m=location.hash.match(/#p=([zj][A-Za-z0-9_-]+)/);if(!m)return;

  render();
  if(MSG){document.getElementById("app").insertAdjacentHTML("afterbegin",`<div class="banner w">${MSG}</div>`)}
}
