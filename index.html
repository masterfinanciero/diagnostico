<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Diagnóstico MASFIN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Diagnóstico MASFIN: responda unas 12 preguntas y vea qué portafolio o robot de MASFIN se adapta a su capital y a su meta.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#ffffff;--ink:#121a26;--mute:#5a6678;--line:#dbe1ea;--acc:#0e8a75;--acc2:#a8700c;--good:#1d7a4c;--bad:#b13838;--soft:#e3f5f1;--soft2:#f6eedc;--hero:#0f1b33;--heroInk:#f2f5fa;
--fd:"Archivo",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--acc2:#e2a843;--good:#52c48c;--bad:#ef7d7d;--soft:#163330;--soft2:#2d2516;--hero:#0a1322;--heroInk:#f2f5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--acc2:#e2a843;--good:#52c48c;--bad:#ef7d7d;--soft:#163330;--soft2:#2d2516;--hero:#0a1322;--heroInk:#f2f5fa;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55}
.hero{background:var(--hero);color:var(--heroInk)}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero .in{padding-block:34px 30px;display:grid;gap:10px}
.marca{font-family:var(--fd);font-weight:800;letter-spacing:.02em;font-size:15px;display:flex;align-items:center;gap:8px}
.logo{width:92px;height:auto;background:#fff;border-radius:14px;padding:8px;display:block}.marca{gap:14px}
.marca small{font-family:var(--fm);font-weight:400;opacity:.7;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.08}
.hero p{margin:0;opacity:.85;max-width:60ch}
main.in{padding-block:24px 60px;display:grid;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.prog b{display:block;height:100%;background:var(--acc);transition:width .3s}
.paso{font-family:var(--fm);font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.q h2{font-size:21px}
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.op:hover{border-color:var(--acc)} .op.sel{border-color:var(--acc);background:var(--soft)}
.op span{display:grid;gap:2px}.op small{color:var(--mute);font-size:13.5px}
.op i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px}.op.sel i{border:6px solid var(--acc)}
label.f{display:grid;gap:6px;font-weight:500}
input[type=text],input[type=tel],input[type=number]{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--acc)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1f9d55}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;min-height:1em}
.tag{display:inline-block;font-family:var(--fm);font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--acc);letter-spacing:.03em}
.tag.val{background:var(--soft2);color:var(--acc2)}
.res h2{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.kpi span{font-size:12.5px;color:var(--mute)} .kpi b{font-family:var(--fm);font-weight:500;font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.graf{overflow-x:auto}.graf svg{display:block;width:100%;height:auto}
.note{font-size:13.5px;color:var(--mute)}
ul.pasos{margin:0;padding-left:20px;display:grid;gap:6px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.aviso{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.alt{border-left:4px solid var(--acc2)} .prin{border-left:4px solid var(--acc)}
.rg{width:100%;accent-color:var(--acc);margin:6px 0}
.rgval{font-family:var(--fm);font-size:28px}
.warn{background:var(--soft2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warn.bad{color:var(--bad)}
.card{min-width:0;max-width:100%;grid-template-columns:minmax(0,1fr)}
main.in{grid-template-columns:minmax(0,1fr)}
#app{min-width:0;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.card>*{min-width:0}
#cuentacard .tbl,#fondcard .tbl,#rgcard .tbl{overflow-x:auto;max-width:100%}
#cuentacard table td,#cuentacard table th{padding:6px 5px;vertical-align:top}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:600;list-style-position:inside}
.faq details p,.faq details ul{margin:8px 0 0;font-size:14px}
.faq h4{margin:16px 0 4px;font-family:var(--fm);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
footer{font-size:12.5px;color:var(--mute);text-align:center;padding-bottom:30px}
</style>

  else if(pf==='conservador'){ p = c<700 ? 'Ancla' : 'Núcleo'; }
  else { if(c<700) p='Ancla'; else if(c<3000) p='Núcleo'; else p='Constancia'; }
  if(p==='Constancia Turbo') nota.push('<b>Regla Escudo (cuida su capital):</b> si la cuenta cae 10% desde su punto más alto, el asesor <b>Constancia Turbo Unificado</b> baja solo al riesgo normal de Constancia (la mitad) y vuelve al Turbo cuando la cuenta recupera su máximo. En el escenario realista eso bajó la peor caída de 18,6% a 15,7%. Además le llega una alerta al celular cuando se activa.');
  if(pf==='alto' && p==='Voltaje Capo') nota.push('Alto riesgo a conciencia: cada robot arriesga 2% y en un día de noticias pueden estar abiertos varios a la vez (hasta 8% si todos tocaran stop). Ponga solo plata que pueda perder. Si lo que busca es el mayor crecimiento posible, pregúntenos por Constancia con riesgo doble.');
  if(p==='Voltaje Capo') nota.push('<b>Tenga en cuenta: Voltaje Capo opera solo 2 o 3 días al mes</b>, los días de empleo (NFP) e inflación (IPC) de EE. UU. El resto del mes la cuenta se queda quieta, y es normal. Acierta mucho, pero por operar tan poco crece menos que Constancia; su ventaja es la precisión, no la cantidad de operaciones.');
  const diasMes = p==='Vértice' ? 20 : ((D.port[p]||{}).act||0);
  if(R.frec==='semana' && diasMes<6) nota.unshift(`<b>Atención, usted quiere ver movimiento casi todas las semanas:</b> ${p==='Voltaje Capo'?'Voltaje Capo':'este portafolio'} opera solo unos ${String(diasMes).replace('.',',')} días al mes, así que habrá semanas enteras sin operaciones. Si quiere ingresos más seguidos, ${c>=3000?'el portafolio <b>Constancia</b> opera unos 19 días al mes':'el portafolio <b>Núcleo</b> opera unos 7 días al mes (y Constancia, desde $3.000, unos 19)'}.`);
  if(pf==='alto' && r===1) nota.push('Usted eligió alto riesgo, pero también dijo que se desespera con varios días seguidos en pérdida. Con alto riesgo esas rachas pasan: piénselo bien o empiece por Moderado.');
  const EST={tecnico:'Trazo Técnico',fundamental:'Pulso Noticias'}[R.estilo];
  if(EST && (R.meta==='propia'||R.meta==='nose')){
    p=EST; for(let i=nota.length-1;i>=0;i--) if(/Constancia Turbo|Voltaje Capo|Escudo/.test(nota[i])) nota.splice(i,1);
    nota.unshift(`<b>Usted eligió operar ${R.estilo==='tecnico'?'solo análisis técnico':'solo noticias'}.</b> Le armamos el portafolio <b>${PORT_INFO[p].t}</b> solo con robots de ese estilo, en un único asesor (${p==='Pulso Noticias'?'Pulso Noticias Unificado':'Trazo Técnico Unificado'}) con una sola clave.`);
    if(c<3000) nota.push(`Este portafolio tiene robots de oro y Nasdaq que piden desde unos $3.000: con menos, el lote mínimo los haría arriesgar más de lo indicado. Móntelo en demo mientras junta el capital${c>=700?', o empiece por el Núcleo':''}.`);
    if(pf==='alto') nota.push('Su perfil es de riesgo alto: en el asesor puede elegir <b>Perfil Turbo</b> (doble riesgo). La ganancia y la caída se duplican, y trae la regla Escudo: si la cuenta cae 10% desde su máximo, vuelve sola al riesgo normal hasta recuperarlo. Empiece con el perfil Normal los primeros 20 trades.');
    if(R.estilo==='fundamental') nota.push('Un portafolio de solo noticias opera unos 12 días al mes, concentrados en los días de datos: habrá semanas tranquilas y semanas movidas.');
  }
  // ---- reglas del proyecto ----
  const P1=k=>(D.port[k]||{}).r||{}, dec=x=>String(x).replace('.',','), DDE=k=>k==='Constancia Turbo'?15.7:P1(k).dd;
  if(R.meta==='propia'||R.meta==='nose'){
    const lim={5:5,10:10,20:20,30:99}[R.p_caida]||99, ord=['Constancia Turbo','Constancia','Núcleo','Ancla'], min={'Constancia Turbo':1500,'Constancia':3000,'Núcleo':700,'Ancla':0,'Voltaje Capo':1000};
    if(EST && D.port[p] && DDE(p)>lim*1.05){ const f=Math.max(.25,Math.floor(lim/DDE(p)*4)/4); nota.unshift(`<b>Su regla de pérdida máxima es ${lim}%.</b> ${PORT_INFO[p].t} puede caer ${dec(DDE(p))}% en el escenario realista. Monte el asesor con el ${Math.round(f*100)}% del riesgo normal: así la caída realista queda cerca de ${dec(Math.round(P1(p).dd*f*10)/10)}%.`); }
    else if(D.port[p] && DDE(p)>lim*1.05){
      const cand=ord.filter(k=>c>=min[k] && DDE(k)<=lim*1.05).sort((a,b)=>P1(b).anual-P1(a).anual);
      const ant=p;
      if(cand.length){ p=cand[0]; nota.unshift(`<b>Su regla de pérdida máxima es ${lim}%.</b> ${PORT_INFO[ant].t} puede caer ${dec(DDE(ant))}% en el escenario realista${ant==='Constancia Turbo'?' (aun con la regla Escudo)':''}, más de lo que usted acepta. Por eso le recomendamos <b>${PORT_INFO[p].t}</b>, con caída realista de ${dec(DDE(p))}%.`); }
      else { const k=ord.filter(k=>c>=min[k]).sort((a,b)=>DDE(a)-DDE(b))[0]||'Ancla'; p=k; const f=Math.max(.25,Math.floor(lim/DDE(p)*4)/4); nota.unshift(`<b>Su regla de pérdida máxima es ${lim}%.</b> Ningún portafolio cabe con su riesgo normal: monte <b>${PORT_INFO[p].t}</b> con el ${Math.round(f*100)}% del riesgo normal. Así la caída realista queda cerca de ${dec(Math.round(P1(p).dd*f*10)/10)}% y la ganancia cerca de ${pct(Math.round(P1(p).anual*f*10)/10)} al año.`); }
    }
    if(R.p_retiro==='mes') nota.push(`<b>Retiro mensual:</b> ${PORT_INFO[p]?PORT_INFO[p].t:p} cierra en verde el ${P1(p).mpos||'—'}% de los meses. Retire solo de la ganancia acumulada y deje la cuenta crecer los meses en rojo; si saca dinero todos los meses, la cuenta crece mucho menos que con interés compuesto.`);
    if(R.p_retiro==='crecer') nota.push('Dejar crecer las ganancias (interés compuesto) es lo que más multiplica la cuenta. Igual conviene revisar el resultado cada 3 meses.');
  }
  let riesgoFondeo=null;
  if(R.meta==='cfd'){
    if(R.c_noticias==='no'){ p='Peldaño sin noticias'; nota.unshift('<b>Su firma prohíbe operar 5 minutos antes y 5 después de las noticias:</b> le quitamos los robots de noticias (Explosiones, Oceanía, Kairós y Rebote NFP) y dejamos los técnicos con una <b>pausa automática</b> alrededor de cada noticia fuerte del dólar (y de la Fed a las 2:00 p. m. de NY). Las cifras de abajo ya quitan las operaciones que caían en esa ventana: en 2024–2026 fueron unas 7 de cada 100. Si su firma usa otra ventana (2 o 10 minutos), el asesor la deja cambiar.'); }
    if(R.c_noticias==='nose') nota.push('Confirme con la firma si permite operar en noticias. Si no lo permite, use el <b>Peldaño sin noticias</b>: varios robots del Peldaño operan justo en el dato.');
    const L=+({3:3,4:4,5:5}[R.c_diaria]||4), T=+({6:6,8:8,10:10}[R.c_total]||8), o=P1(p);
    const f=Math.max(.25,Math.min(p==='Peldaño sin noticias'?3:1,Math.floor(Math.min(L*0.5/Math.abs(o.peordia||1), T*0.5/(o.dd||1))*4)/4));
    riesgoFondeo={f,L,T};
    nota.unshift(`<b>Con las reglas de su firma</b> (pérdida diaria ${L}% y total ${T}%), monte el portafolio con el <b>${Math.round(f*100)}% del riesgo del ${p}</b>. Así su peor día queda cerca de −${dec(Math.round(Math.abs(o.peordia)*f*10)/10)}% y la caída máxima cerca de −${dec(Math.round(o.dd*f*10)/10)}%, la mitad o menos de lo que la firma permite.${R.c_diaria==='nose'||R.c_total==='nose'?' Como no sabe una de las reglas, tomamos valores seguros: confírmelas antes de comprar.':''}`);
    const g=o.anual*f/12, meta={2:'8% en la fase 1 y 5% en la fase 2',1:'10%'}[R.c_fases];
    if(meta && g>0){ const m1=R.c_fases==='2'?Math.ceil(8/g):Math.ceil(10/g); nota.push(`<b>Tiempo estimado:</b> con unos ${pct(Math.round(g*10)/10)} al mes en el escenario realista, la meta de ${meta} toma alrededor de ${m1} ${m1===1?'mes':'meses'}${R.c_fases==='2'?` la primera fase y ${Math.ceil(5/g)} la segunda`:''}. Escoja una firma sin límite de días para el examen.`); }
    if(R.c_fases==='inst') nota.push('En fondeo instantáneo no hay examen, pero la pérdida máxima suele ser más corta y a veces "trailing" (sube con la cuenta): mantenga el riesgo que le indicamos y no lo suba hasta tener un colchón de ganancia.');
  }
  if(R.meta==='futuros'){
    if(R.f_firma && R.f_firma!=='lucid') nota.push(`Vértice está calibrado con las reglas de <b>Lucid Flex 50K</b>. En ${({topstep:'Topstep',apex:'Apex'})[R.f_firma]||'otra firma'} revise antes la meta, la pérdida máxima y si permite robots y noticias; le ajustamos los riesgos a esas reglas.`);
    if(R.f_tam && R.f_tam!=='50') nota.push(`Las cifras de abajo son para una cuenta de $50.000. En una de ${R.f_tam}K los contratos se ajustan en proporción ${+R.f_tam<50?'(con 25K, menos contratos y más días para pasar)':'(más contratos, misma lógica)'}.`);
    if(R.f_dd==='intra') nota.unshift('<b>Ojo: su pérdida máxima se mide en tiempo real (intradía).</b> Vértice se validó con pérdida medida al cierre del día. Con la intradía, una operación que va en contra y luego se recupera igual le cuenta: móntelo con la mitad del riesgo hasta tener colchón.');
    if(R.f_dd==='nose') nota.push('Confirme si la pérdida máxima se mide al cierre del día (EOD) o en tiempo real: con la de tiempo real hay que bajar el riesgo a la mitad.');
    if(R.f_cons==='si') nota.push('Su cuenta tiene regla de consistencia: el "guardián" de Vértice frena el día cuando una sola ganancia se acerca al límite, para que no tenga que repartirla en más días.');
  }
  if((R.meta==='axi'||R.meta==='darwinex') && R.x_plazo==='3') nota.push('Ojo con el plazo: estos programas premian la constancia de varios meses. En 3 meses es posible no tener todavía la calificación para que le asignen capital; cuente con 6 meses o más.');
  window._riesgoFondeo=riesgoFondeo;
  // robot solo
  let s;
  if(R.meta==='futuros') s='Descorrelación';
  else if(R.activo==='oro'){ if(c>=3000) s=(r===1?'Falso 9 Jornada':'Radar Rezago'); else { s='Expl EUR/USD'; nota.push('Los robots de oro piden desde unos $3.000: con menos capital, el lote mínimo (0,01) los haría arriesgar 3 a 4 veces más de lo indicado. Por eso le sugerimos uno de divisas mientras crece la cuenta.'); } }
  else if(R.activo==='nasdaq'){ if(c>=500) s='Descorrelación'; else { s='Expl EUR/USD'; nota.push('Los robots del Nasdaq piden desde unos $500. Mientras tanto, uno de divisas en cuenta cent.'); } }
  else if(R.activo==='divisas') s=(r===1?'Expl USD/JPY':'Expl EUR/USD');
  else s='Expl EUR/USD';
  if(R.estilo==='fundamental' && !['Expl EUR/USD','Expl USD/JPY','Expl Nasdaq'].includes(s)) s=(R.activo==='nasdaq'&&c>=500)?'Expl Nasdaq':'Expl USD/JPY';
  if(R.estilo==='tecnico' && !['Falso 9 Jornada','Radar Rezago','ORB','Descorrelación'].includes(s)) s=(R.activo==='oro'&&c>=3000)?'Falso 9 Jornada':'ORB';
  if(R.equipo!=='vps') nota.push(p==='Ancla' ? 'No necesita VPS: el Ancla opera unos 3 días al mes, en noticias con fecha y hora fijas (empleo e inflación de EE. UU. en la mañana; Australia y Nueva Zelanda en la noche). Le enviamos el calendario y solo prende MetaTrader esos días.' : 'Los robots tienen que estar prendidos a la hora de su señal (algunos operan de noche). Lo más seguro es un VPS: un computador en la nube que cuesta unos $10 a $20 al mes.');
  if(R.plataforma==='mt4') nota.push('Los robots de MASFIN son para MetaTrader 5. Abrir una cuenta MT5 en el mismo bróker es gratis.');
  if(R.plataforma==='ninja' && R.meta!=='futuros') nota.push('Para cuenta propia y fondeo CFD los robots corren en MetaTrader 5; NinjaTrader se usa para futuros.');
  if(R.exp==='nuevo') nota.push('Como está empezando: primero 2 semanas en cuenta demo con el robot montado tal cual, para que lo vea operar antes de poner plata.');
  const proy = (R.meta==='axi'||R.meta==='darwinex') ? R.meta : null;
  if(proy==='axi' && c<500) nota.push('Axi Select pide un depósito mínimo de $500 en su cuenta Axi. Mientras junta ese capital, monte el portafolio en demo.');
  if(proy && c<3000) nota.push('Con menos de unos $3.000, los robots de oro y Nasdaq del portafolio pueden saltarse operaciones por el lote mínimo. Funciona, pero rinde más desde $3.000.');
  if(proy) nota.push('Antes de montarlo, confirme con '+(proy==='axi'?'Axi':'Darwinex')+' que el programa permite robots (asesores expertos): las condiciones cambian y no están claras en su página.');
  return {p,s,nota,proy,pf};
}

function barras(vals,labels,escala){ // escala: multiplica vals
  const v=vals.map(x=>x*escala), W=560, H=200, pad=58, max=Math.max(1,...v.map(Math.abs));
  const bw=(W-pad-8)/v.length, y0=H/2;
  let s=`<svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Resultado mes a mes"><line x1="${pad}" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  s+=`<text x="${pad-6}" y="14" text-anchor="end" font-size="10" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">${usd(max)}</text><text x="${pad-6}" y="${H-4}" text-anchor="end" font-size="10" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">${usd(-max)}</text>`;
  v.forEach((x,i)=>{const h=Math.abs(x)/max*(H/2-12), X=pad+i*bw+1; s+=`<rect x="${X}" y="${x>=0?y0-h:y0}" width="${Math.max(2,bw-3)}" height="${Math.max(1,h)}" rx="2" fill="${x>=0?'var(--good)':'var(--bad)'}"><title>${labels[i]}: ${usd(x)}</title></rect>`;
    if(labels[i].endsWith('-01')) s+=`<text x="${X}" y="${H+16}" font-size="10.5" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">${labels[i].slice(0,4)}</text>`;});
  return s+'</svg>';
}
function caidas(vals,labels,escala){
  const v=vals.map(x=>Math.min(0,x)*escala), W=560, H=120, pad=58, max=Math.max(1,...v.map(Math.abs));
  const bw=(W-pad-8)/v.length;
  let s=`<svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Caída desde el máximo, mes a mes"><line x1="${pad}" x2="${W}" y1="4" y2="4" stroke="var(--line)"/>`;
  s+=`<text x="${pad-6}" y="12" text-anchor="end" font-size="10" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">$0</text><text x="${pad-6}" y="${H}" text-anchor="end" font-size="10" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">${usd(-max)}</text>`;
  v.forEach((x,i)=>{const h=Math.abs(x)/max*(H-8), X=pad+i*bw+1; s+=`<rect x="${X}" y="4" width="${Math.max(2,bw-3)}" height="${Math.max(1,h)}" rx="2" fill="var(--bad)" opacity="${x===Math.min(...v)?1:.55}"><title>${labels[i]}: ${usd(x)}</title></rect>`;
    if(labels[i].endsWith('-01')) s+=`<text x="${X}" y="${H+16}" font-size="10.5" fill="var(--mute)" font-family="IBM Plex Mono, ui-monospace, monospace">${labels[i].slice(0,4)}</text>`;});
  return s+'</svg>';
}
function intentos(p){p=p/100; return p>=1?1:Math.ceil(Math.log(.05)/Math.log(1-p));}

function bloquePort(p,c,demo,proy){
  if(p==='Vértice'){
    const v=D.vertice, n=intentos(v.r.pasa), res=n*80.5;
    return `<div class="card res prin"><span class="tag">Portafolio recomendado</span><h2>Vértice Futuros MASFIN</h2><span class="tag val">En validación en demo</span>
    <p>Cinco robots en NinjaTrader que trabajan juntos con un "guardián" que cuida las reglas de la cuenta (meta, pérdida máxima, consistencia): noticias en euro, Oceanía y Nasdaq, ruptura de apertura y descorrelación dólar–Nasdaq. Pensado para una cuenta de fondeo de futuros de $50.000.</p>
    <div class="kpis"><div class="kpi"><span>Pasa el examen 50K</span><b>${v.r.pasa}%</b></div><div class="kpi"><span>Días hábiles para pasar</span><b>~${Math.round(v.r.dias)}</b></div><div class="kpi"><span>Reserve para intentos (95%)</span><b>${usd(res)}</b></div><div class="kpi"><span>Meses verdes</span><b>${v.r.mpos}%</b></div><div class="kpi"><span>Caída máxima</span><b>−${String(v.r.ddpct).replace('.',',')}%</b><small style="color:var(--mute)">${usd(-v.r.dd)}</small></div></div>
    <h3>Cómo le habría ido mes a mes en la cuenta de $50.000</h3><div class="graf">${barras(v.r.mes,v.meses,1)}</div>
    <p class="note">Escenario realista: cada robot ganando solo la mitad de lo que ganó en las pruebas. Si repite el pasado, pasa el ${v.h.pasa}%. Reserva = ${n} exámenes de $80,50 para tener 95% de probabilidad de aprobar al menos uno; se compra uno a la vez.</p></div>`;
  }
  const o=D.port[p], I=proy?Object.assign({},PORT_INFO[p],PROY[proy]):PORT_INFO[p], fon=p.startsWith('Peldaño'), base=fon&&!proy?(c>0?c:10000):c;
  const rf=(R.meta==='cfd'&&window._riesgoFondeo)?window._riesgoFondeo.f:1, esc=base/100*rf, q=x=>Math.round(x*rf*10)/10;
  const capTxt = proy ? `${PROY[proy].cap} ${usd(base)}` : (fon ? `en una cuenta de fondeo de ${usd(base)}` : `con ${usd(base)}`);
  return `<div class="card res prin"><span class="tag">Portafolio recomendado</span><h2>${I.t}</h2><span class="tag val">${I.estado}</span>
  <p>${I.d}</p><div class="chips">${o.cols.map(x=>`<span class="chip">${NOM[x]}</span>`).join('')}</div>
  ${rf<1?`<p class="note"><b>Cifras con el ${Math.round(rf*100)}% del riesgo</b>, el que le indicamos para las reglas de su firma.</p>`:''}
  <div class="kpis"><div class="kpi"><span>Ganancia al año (realista)</span><b>${pct(q(o.r.anual))}</b></div><div class="kpi"><span>${capTxt}</span><b>${usd(o.r.anual*esc)}</b></div><div class="kpi"><span>Caída máxima</span><b>−${String(q(o.r.dd)).replace('.',',')}%</b><small style="color:var(--mute)">${usd(-o.r.dd*esc)}</small></div><div class="kpi"><span>Días con operación al mes</span><b>${String(o.act).replace('.',',')}</b></div></div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><span>Meses verdes</span><b>${o.r.mpos}%</b></div><div class="kpi"><span>Peor mes</span><b>${pct(q(o.r.peor))}</b></div><div class="kpi"><span>Semanas verdes</span><b>${o.r.wpos}%</b><small style="color:var(--mute)">de las semanas con operación</small></div><div class="kpi"><span>Peor semana</span><b>${pct(q(o.r.peorsem))}</b></div><div class="kpi"><span>Peor día</span><b>${pct(q(o.r.peordia))}</b></div></div>
  <h3>Cómo le habría ido mes a mes ${capTxt}</h3><div class="graf">${barras(o.r.mes,o.meses,esc)}</div>
  <h3>Caída desde el punto más alto, mes a mes</h3><div class="graf">${caidas(o.r.ddm,o.meses,esc)}</div>
  <p class="note">Cada barra roja es lo más abajo que estuvo la cuenta ese mes frente a su máximo anterior. La más larga es la caída máxima: −${String(q(o.r.dd)).replace('.',',')}% (${usd(-o.r.dd*esc)}).${p==='Constancia Turbo'?' Con la regla Escudo la caída máxima baja a cerca de −15,7%.':''}</p>
  <p class="note">Escenario realista, enero 2024 a octubre 2026: cada robot ganando solo la mitad de lo que ganó en las pruebas, porque en vivo casi siempre se gana menos. Si repite el pasado: ${pct(o.h.anual)} al año. ${demo?'<b>Con su capital de hoy, este portafolio se recorre primero en demo</b> mientras junta los $500 para montarlo en cuenta cent.':''}</p></div>`;
}
function bloqueSolo(s,c){
  const o=D.solo[s], base=Math.max(c,s==='Descorrelación'&&R.meta==='futuros'?0:c), esc=(c>0?c:1000)/100;
  return `<div class="card res alt"><span class="tag val">Si prefiere empezar con un solo robot</span><h2>${NOM[s]}</h2>
  <p>${DESC_SOLO[s]||''}</p>
  <div class="kpis"><div class="kpi"><span>Ganancia al año (realista)</span><b>${pct(o.r.anual)}</b></div><div class="kpi"><span>Con ${usd(c>0?c:1000)}</span><b>${usd(o.r.anual*esc)}</b></div><div class="kpi"><span>Caída máxima</span><b>−${String(o.r.dd).replace('.',',')}%</b><small style="color:var(--mute)">${usd(-o.r.dd*esc)}</small></div><div class="kpi"><span>Meses verdes</span><b>${o.r.mpos}%</b></div><div class="kpi"><span>Semanas verdes</span><b>${o.r.wpos}%</b></div><div class="kpi"><span>Peor semana</span><b>${pct(o.r.peorsem)}</b></div><div class="kpi"><span>Días con operación al mes</span><b>${String(o.act).replace('.',',')}</b></div></div>
  <div class="graf">${barras(o.r.mes,o.meses,esc)}</div><div class="graf">${caidas(o.r.ddm,o.meses,esc)}</div>

  <div class="kpis"><div class="kpi"><span>Ganancia al año (realista)</span><b>${pct(Math.round(an*10)/10)}</b><small style="color:var(--mute)">${usd(an/100*g.c)}</small></div>

  <div class="kpi"><span>Peor mes</span><b>${pct(Math.round(o.peor*m*10)/10)}</b></div>

  <p class="note" style="margin-top:10px">Para recuperar una caída de ${dec1(dd)}% la cuenta necesita ganar ${dec1(rec)}%. Por eso las caídas grandes cuestan tanto.</p>

function diasPort(p){ const o=D.port[p]; if(!o||!o.dia) return []; const out=[]; let d=new Date(o.dia0+'T00:00:00Z');
  for(const v of o.dia){ while(d.getUTCDay()===0||d.getUTCDay()===6) d=new Date(d.getTime()+864e5); out.push([d.toISOString().slice(0,10),v]); d=new Date(d.getTime()+864e5); } return out; }
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fCorta=s=>{const d=new Date(s+'T00:00:00Z');return `${d.getUTCDate()} ${MESC[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
function simCFD(dias,m,S,fases,L,T,cfg){
  cfg=cfg||{}; const metas=cfg.metas||(fases==='1'?[10]:[8,5]), split=cfg.split||0.8, pago=cfg.pago||14, unaVez=cfg.unaVez;
  const ev=[]; let fase=fases==='inst'?'F':'1', bal=0, ultimo=null, examenes=1, cobrado=0, inicioF=null, pico=0;
  const nombre={'1':fases==='1'?'el examen':'la fase 1','2':'la fase 2'};
  for(const [d,v0] of dias){ const v=v0*m;
    const piso=cfg.trailing?Math.min(0,pico)-T:-T;
    if(v<=-L || bal+v<=piso){ ev.push([d,'bad',`Se quema la cuenta (${v<=-L?`pérdida del día ${pct(Math.round(v*10)/10)}`:'pérdida máxima'}). Compra otro examen.`]); if(unaVez) return {ev,examenes,cobrado,fase:'X',bal,quema:d}; fase=fases==='inst'?'F':'1'; bal=0; pico=0; examenes++; inicioF=fases==='inst'?d:null; continue; }
    bal+=v; pico=Math.max(pico,bal);
    if(fase!=='F'){ const meta=metas[+fase-1];
      if(bal>=meta){ if(fase==='1'&&metas.length>1){ ev.push([d,'good',`Pasa ${nombre['1']} (+${dec1(bal)}%).`]); fase='2'; }
        else { ev.push([d,'good',`Pasa ${fase==='2'?nombre['2']:nombre['1']} (+${dec1(bal)}%): <b>cuenta fondeada</b>.`]); fase='F'; inicioF=d; ultimo=d; if(unaVez) return {ev,examenes,cobrado,fase,bal,fondeada:d}; }
        bal=0; pico=0; continue; } }
    if(fase==='F'){ if(!inicioF){inicioF=d;ultimo=d;}
      if((Date.parse(d)-Date.parse(ultimo))/864e5>=pago && bal>0){ const c=bal/100*S*split; cobrado+=c; ev.push([d,'pay',`<b>Cobra ≈ ${usd(c)}</b> (${Math.round(split*100)}% de +${dec1(bal)}%).`]); bal=0; pico=0; ultimo=d; } }
  }
  return {ev,examenes,cobrado,fase,bal};
}
function simAxi(dias,m,E0){
  const ET=[['Seed',500,10,0.40,5000],['Incubation',1000,25,0.50,25000],['Acceleration',2000,50,0.50,100000],['Pro',5000,40,0.60,200000],['Pro 500',10000,50,0.70,500000],['Pro M',20000,50,0.80,1000000]];
  const asig=(i,E)=>Math.min(E*ET[i][2],ET[i][4]); let dEt=null;
  const ev=[]; let E=E0, act=0, et=-1, g=0, pico=0, cobrado=0, mesK=null, mesGan=0, ultD=null;
  const cierreMes=()=>{ if(et>=0 && mesGan>0){ const c=mesGan*ET[et][3]; cobrado+=c; ev.push([ultD,'pay',`<b>Cobra ≈ ${usd(c)}</b> (${Math.round(ET[et][3]*100)}% de la ganancia del capital asignado en el mes).`]); } mesGan=0; };
  for(const [d,v0] of dias){ const v=v0*m; const k=d.slice(0,7);
    if(mesK && k!==mesK) cierreMes(); mesK=k;
    if(v!==0) act++; E*=1+v/100; ultD=d;
    if(et<0){ if(act>=20 && E>=500){ et=0; g=0; pico=0; dEt=d; ev.push([d,'good',`Entra a <b>Seed</b>: le asignan ≈ ${usd(asig(0,E))}.`]); } continue; }
    g+=v; pico=Math.max(pico,g); mesGan+=v/100*asig(et,E);
    if(pico-g>=10){ const ant=ET[et][0]; et=Math.max(0,et-1); g=0; pico=0; dEt=d; ev.push([d,'bad',`Cae 10% desde su máximo en ${ant}: baja a ${ET[et][0]}.`]); continue; }
    if(g>=7 && (Date.parse(d)-Date.parse(dEt))/864e5>=60 && et<2 && E>=ET[et+1][1]){ et++; g=0; pico=0; dEt=d; ev.push([d,'good',`Sube a <b>${ET[et][0]}</b>: capital asignado ≈ ${usd(asig(et,E))}, reparto ${Math.round(ET[et][3]*100)}%.`]); }
  }
  return {ev,E,et:et<0?'sin etapa todavía':ET[et][0],cobrado};
}

  let ok=0,mal=0,sem=[];

function cuentaPintar(){
  const el=$('#cuentaout'); if(!el) return; const x=window._x, p=x.p, B=R.capital>0?R.capital:0;
  const m=($('#rg')?+$('#rg').value:(window._rg||{rec:1}).rec), dias=diasPort(p), o=D.port[p].r;
  let L=FIRMAS.filter(F=>!R.c_fases||R.c_fases==='nose'||F.fases===R.c_fases);
  const filas=[]; let mejor=null;
  for(const F of L){ const ev=evalFirma(F,dias,m), n=Math.max(2,ev.p>=1?1:(ev.p>0?Math.ceil(Math.log(.05)/Math.log(1-ev.p)):99));   // mínimo 2 intentos por prudencia
    const tam=Object.keys(F.precios).map(Number).sort((a,b)=>a-b);
    let elegido=null; for(const s of tam){ const pr=F.precios[s]*(F.mon==='€'?EUR_USD:1); if(pr*n<=B) elegido=s; }
    const s=elegido||tam[0], pr=F.precios[s], prU=pr*(F.mon==='€'?EUR_USD:1), mes=s*o.anual*m/12/100*F.split;
    const fila={F,s,pr,prU,n,ev,mes,cabe:!!elegido}; filas.push(fila);
    if(fila.cabe && (!mejor || fila.mes/ (fila.n*fila.prU) > mejor.mes/(mejor.n*mejor.prU)*1.15 || fila.mes>mejor.mes*1.3)) mejor=fila; }
  const precio=f=>`${f.F.mon}${Math.round(f.pr).toLocaleString('es-CO')}`, res=f=>`${f.F.mon}${Math.round(f.pr*f.n).toLocaleString('es-CO')}`;
  let h='';
  if(mejor) h+=`<div class="warn"><b>Le recomendamos: ${mejor.F.f} ${mejor.F.prog} de ${usd(mejor.s)}</b> (${precio(mejor)} por examen). Con su presupuesto de ${usd(B)} alcanza para ${mejor.n} ${mejor.n===1?'intento':'intentos'}, para tener 95% de probabilidad de quedar fondeado (mínimo 2 intentos por prudencia: en vivo siempre se gana menos que en las pruebas). Ya fondeado, cobraría unos <b>${usd(mejor.mes)} al mes</b> en el escenario realista.</div>`;
  else h+=`<div class="warn bad">Con ${usd(B)} todavía no alcanza para la reserva de intentos de ninguna cuenta. Empiece por la más pequeña de la tabla (un intento a la vez) o junte para la reserva completa; mientras tanto, pruebe el portafolio en demo.</div>`;
  h+=`<div class="tbl" style="margin-top:10px"><table style="width:100%;font-size:13px"><thead><tr><th style="text-align:left">Cuenta</th><th>Tamaño</th><th>Precio</th><th>Pasa*</th><th>Semanas típicas</th><th>Reserva 95%</th><th>Cobro al mes</th></tr></thead><tbody>${filas.map(f=>`<tr${f===mejor?' style="background:var(--soft)"':''}><td style="text-align:left"><b>${f.F.f}</b><br><small>${f.F.prog} · meta ${f.F.metas.length?f.F.metas.join('% y ')+'%':'sin examen'} · diaria ${f.F.L}% · total ${f.F.T}%</small></td><td>${usd(f.s)}${f.cabe?'':'<br><small style="color:var(--bad)">no alcanza</small>'}</td><td>${precio(f)}</td><td>${Math.round(f.ev.p*100)}%</td><td>${f.ev.sem==null?'—':(f.F.fases==='inst'?'0':'~'+Math.max(1,Math.round(f.ev.sem)))}</td><td>${res(f)}<br><small>${f.n} ${f.n===1?'intento':'intentos'}</small></td><td>${usd(f.mes)}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<p class="note" style="margin-top:8px">${filas.map(f=>`<b>${f.F.f} ${f.F.prog}:</b> ${f.F.nota}`).join(' ')} *Pasa: probabilidad de quedar fondeado (en la instantánea: de no quemar la cuenta en 6 meses). Probabilidad y semanas: arrancando cada semana de 2024 a 2026 con el ${PORT_INFO[p]?PORT_INFO[p].t:p} al riesgo de la barra. Compre un examen a la vez; la reserva es lo que debe tener guardado por si toca repetir. Precios públicos de FundingPips (sept. 2026) y FTMO (ago. 2026, en euros; FTMO devuelve la tarifa con el primer cobro): confírmelos antes de comprar. Recomendamos firmas que permiten robots: confírmelo con la firma.</p>`;
  const conNoti=D.port[p].cols.some(k=>/Expl|Kair|Rebote/.test(k));
  if(conNoti) h+=`<div class="warn bad" style="margin-top:8px"><b>Ojo con las noticias en la cuenta fondeada:</b> este portafolio tiene robots de noticias. FundingPips no le paga las ganancias de operaciones 5 minutos antes o después de noticias fuertes, y la cuenta fondeada normal de FTMO tampoco deja operar justo en la noticia (su cuenta "Swing" sí). Para el examen sirve tal cual; ya fondeado, pase al portafolio <b>Peldaño sin noticias</b> (asesor Trazo Técnico con la regla de noticias) o use la cuenta Swing. Confírmelo con la firma.</div>`;
  el.innerHTML=h; window._cuenta=mejor||filas[0]||null; fondPintar();
}
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='rg') cuentaPintar(); });

function resultado(){
  const x=elegir(), c=R.capital, demo=(x.p==='Ancla'&&c<300);
  window._x=x;
  const wa = WA_NUMERO ? `<a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/${WA_NUMERO}">Enviar mi resultado por WhatsApp</a>` : '';
  return `<div class="card"><span class="paso">Su diagnóstico</span><h2>${esc(R.nombre)}, esto es lo que se adapta a usted</h2>
  <p class="note">Capital: ${usd(c)} · Meta: ${PQ('meta').o.find(o=>o[0]===R.meta)[1]} · Mercado: ${PQ('activo').o.find(o=>o[0]===R.activo)[1]}</p><p><span class="tag${x.pf==='alto'?' val':''}">Su perfil: ${PERFIL_TXT[x.pf]}</span></p></div>
  ${bloquePort(x.p,c,demo,x.proy)}
  ${riesgoCard(x,c)}
  ${cuentaCard(x,c)}
  ${fondeoCard(x,c)}
  <div id="vivocard"></div>
  ${bloqueSolo(x.s,c)}
  ${horario(x)}
  <div class="dos"><div class="card"><h3>Sus próximos pasos</h3><ul class="pasos">${pasos(x.p,x.proy).map(t=>`<li>${t}</li>`).join('')}</ul></div>
  ${x.nota.length?`<div class="card"><h3>Para tener en cuenta</h3><ul class="pasos">${x.nota.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}</div>
  <div class="card"><span class="tag">Calcule su riesgo</span><h3>Vea su caída máxima y su ganancia mes a mes con su capital</h3><p>Abra la Calculadora de Riesgo MASFIN ya cargada con su recomendación y ${usd(c>0?c:1000)}. Allí puede mover el riesgo y ver la peor caída probable, cuánto le cabe y cómo le habría ido mes a mes.</p>
  <div class="nav" style="justify-content:flex-start"><a class="btn" target="_blank" rel="noopener" href="${calcLink('p',x.p,c)}">Calcular mi portafolio</a><a class="btn sec" target="_blank" rel="noopener" href="${calcLink('e',x.s,c)}">Calcular el robot solo</a></div></div>
  ${pasoCuenta(x.p,x.proy)}
  <div class="card"><span class="tag">Paso 3</span><h3>Envíenos su resultado</h3><p>Le llega directo a Master Valencia por WhatsApp. Con su número de cuenta le preparamos el robot con su licencia personal.</p><div class="nav" style="justify-content:flex-start">${wa}${R.email?`<a class="btn sec" id="mailbtn" href="#">Enviarme el resultado a ${esc(R.email)}</a>`:''}<button class="btn sec" id="copiar">Copiar mi resultado</button><button class="btn sec" id="otra">Hacer el diagnóstico de nuevo</button></div><p class="note" id="copiado"></p>
  ${faqCard(x)}
  <p class="aviso">Resultados de pruebas sobre datos de 2024 a 2026, no garantizan resultados futuros. "Realista" descuenta la mitad de la ganancia de cada robot. Operar con apalancamiento puede hacer perder el capital. Esto es información educativa, no una asesoría de inversión personalizada.</p></div>`;
}
function enganchar(){
  rgPintar(); cuentaPintar(); fondPintar();
  vivoListo.then(()=>pintarVivo(window._x,R.capital));
  const a=$('#wa'); if(a){ const act=()=>{a.href=`https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(resumen(window._x))}`}; act(); a.onclick=act; a.onmousedown=act; a.ontouchstart=act; ['#cta','#brk'].forEach(s=>{const e=$(s); if(e){e.oninput=act; e.onchange=act;}}); }
  const mb=$('#mailbtn'); if(mb){ const setm=()=>{mb.href=`mailto:${encodeURIComponent(R.email)}?subject=${encodeURIComponent('Mi Diagnóstico MASFIN')}&body=${encodeURIComponent(resumen(window._x))}`}; setm(); mb.onmousedown=setm; mb.ontouchstart=setm; }
  $('#otra').onclick=()=>{paso=0;render()};
  $('#copiar').onclick=()=>{const t=resumen(window._x);
    const ok=()=>$('#copiado').textContent='Copiado. Péguelo en el chat de WhatsApp con MASFIN.';
    try{navigator.clipboard.writeText(t).then(ok,()=>fallback(t))}catch(e){fallback(t)}};
}
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();$('#copiado').textContent='Seleccionado: cópielo y péguelo en WhatsApp.';}
render();
</script>
