<title>Panel del Mentor MASFIN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#121a26;--mute:#5a6678;--line:#dbe1ea;--acc:#0e8a75;--soft:#e3f5f1;--good:#1d7a4c;--bad:#b13838;--warn:#b5770b;--soft2:#f6eedc;--hero:#0f1b33;
--fd:"Archivo",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--soft:#163330;--good:#52c48c;--bad:#ef7d7d;--warn:#e9b44c;--soft2:#2d2516;--hero:#0a1322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1118;--panel:#141b25;--ink:#e6ebf2;--mute:#9aa6b7;--line:#273141;--acc:#3fd1b5;--soft:#163330;--good:#52c48c;--bad:#ef7d7d;--warn:#e9b44c;--soft2:#2d2516;--hero:#0a1322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
.in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hero);color:#f2f5fa}header .in{padding-block:20px;display:flex;gap:14px;align-items:center}
.logo{width:60px;background:#fff;border-radius:12px;padding:6px}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em}h1{font-size:23px}h2{font-size:18px}
header p{margin:2px 0 0;opacity:.75;font-size:13.5px}
main.in{padding-block:18px 50px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.note{font-size:13px;color:var(--mute);margin:0}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}td.num,th.num{text-align:right;font-family:var(--fm)}
tr.sel{background:var(--soft)}tbody tr{cursor:pointer}
.good{color:var(--good)}.bad{color:var(--bad)}
.bar{height:9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--bg);border:1px solid var(--line);color:var(--mute)}.chip.ok{background:var(--soft);color:var(--good);border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;background:var(--bg)}.kpi span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.kpi b{font-family:var(--fm);font-size:17px;font-weight:500}
svg.eq{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:16px}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const fm=(x,d=2)=>(x<0?'−':'')+'$'+Math.abs(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fn=(x,d=2)=>(isFinite(x)?(x<0?'−':'')+Math.abs(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}):'—');
let cfg={};try{cfg=JSON.parse(localStorage.getItem('panel_mentor_masfin')||'{}');}catch(e){}
$('url').value=cfg.url||'';
let A=[];
function st(ops,cap){let eq=cap||0,pk=eq,dd=0,ddp=0;const c=[eq];let gw=0,gl=0,w=0;ops.forEach(o=>{const r=+o[5];eq+=r;c.push(eq);if(eq>pk)pk=eq;if(pk-eq>dd){dd=pk-eq;ddp=pk>0?dd/pk*100:0;}if(r>0){gw+=r;w++;}else gl-=r;});
 const n=ops.length,l=ops.filter(o=>+o[5]<0).length;return {n,win:n?w/n*100:0,pf:gl>0?gw/gl:(gw>0?Infinity:0),neto:gw-gl,dd,ddp,c,aw:w?gw/w:0,al:l?gl/l:0,disc:n?ops.filter(o=>o[3]).length/n*100:0};}
function curva(c){if(c.length<2)return '';const W=640,H=150,mn=Math.min(...c),mx=Math.max(...c),sp=(mx-mn)||1;const pts=c.map((v,i)=>((i/(c.length-1))*(W-20)+10).toFixed(1)+','+(H-10-((v-mn)/sp)*(H-20)).toFixed(1)).join(' ');
 return `<svg class="eq" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--acc)" stroke-width="2.2" points="${pts}"/><text x="12" y="16" font-size="12" fill="var(--mute)">${fm(mx,0)}</text><text x="12" y="${H-2}" font-size="12" fill="var(--mute)">${fm(mn,0)}</text></svg>`;}
async function cargar(){
 $('msg').textContent='Cargando…';
 try{const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'clave='+encodeURIComponent(cfg.clave));const d=await r.json();
  if(d.error){$('msg').textContent='Clave incorrecta.';$('acceso').hidden=false;$('lista').hidden=true;return;}
  A=d.filter(x=>x&&x.id);$('acceso').hidden=true;$('lista').hidden=false;$('act').textContent='Actualizado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});pinta();
 }catch(e){$('msg').textContent='No pude leer los datos. Revise el enlace (debe terminar en /exec).';}}
function pinta(){
 A.sort((a,b)=>(b.res&&b.res.n||0)-(a.res&&a.res.n||0));
 if(!A.length){$('tabla').innerHTML='<div class="empty">Todavía ningún alumno ha registrado operaciones.</div>';return;}
 $('tabla').innerHTML='<table><thead><tr><th>Alumno</th><th>Noticias / 100</th><th>Etapa</th><th class="num">Ganadas</th><th class="num">F. beneficio</th><th class="num">Caída máx.</th><th class="num">Disciplina</th><th class="num">Neto</th><th class="num">Últ. operación</th></tr></thead><tbody>'+
  A.map((a,i)=>{const r=a.res||{},u=(a.ops||[]).slice(-1)[0];return `<tr data-i="${i}"><td><b>${(a.nombre||'').replace(/</g,'')}</b></td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar"><i style="width:${Math.min(100,(r.n||0))}%"></i></div><span style="font-family:var(--fm)">${r.n||0}</span></div></td><td><span class="chip ${r.ok?'ok':''}">${(r.etapa||'').split(' · ')[0]}</span></td><td class="num">${fn(r.win,0)}%</td><td class="num">${r.pf>=99?'∞':fn(r.pf)}</td><td class="num ${r.ddp>10?'bad':''}">${fn(r.ddp,1)}%</td><td class="num ${r.disc<90?'bad':''}">${fn(r.disc,0)}%</td><td class="num ${r.neto>=0?'good':'bad'}">${fm(r.neto||0)}</td><td class="num">${u?u[0]:'—'}</td></tr>`;}).join('')+'</tbody></table><p class="note">Toque un alumno para ver el detalle. Verde = cumple 100 noticias, factor de beneficio ≥ 1,2, caída < 10%, disciplina ≥ 90% y esperanza positiva.</p>';
 $('tabla').querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>{$('tabla').querySelectorAll('tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');detalle(A[+tr.dataset.i]);});}
function detalle(a){const ops=a.ops||[],s=st(ops,a.cap),r=a.res||{};
 const sem={};ops.forEach(o=>{const d=new Date(o[0]+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const k=d.toISOString().slice(0,10);(sem[k]=sem[k]||[]).push(o);});
 $('det').hidden=false;
 $('det').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${(a.nombre||'').replace(/</g,'')}</h2><span class="chip ${r.ok?'ok':''}">${r.etapa||''}</span></div>
 <div class="kpis">${[['Noticias',s.n+' / 100'],['Capital',fm(a.cap||0,0)+' · '+fn(a.rie,1)+'%'],['Ganadas',fn(s.win,0)+'%'],['Factor de beneficio',isFinite(s.pf)?fn(s.pf):'∞'],['Ganancia media',fm(s.aw)],['Pérdida media',fm(-s.al)],['Caída máxima',fm(-s.dd)+' · '+fn(s.ddp,1)+'%'],['Disciplina',fn(s.disc,0)+'%'],['Neto',fm(s.neto)]].map(([x,y])=>`<div class="kpi"><span>${x}</span><b>${y}</b></div>`).join('')}</div>
 ${curva(s.c)}
 <div class="tbl"><table><thead><tr><th>Semana</th><th class="num">Ops</th><th class="num">Ganadas</th><th class="num">Neto</th></tr></thead><tbody>${Object.keys(sem).sort().reverse().map(k=>{const x=st(sem[k],0);return `<tr><td>${k}</td><td class="num">${x.n}</td><td class="num">${fn(x.win,0)}%</td><td class="num ${x.neto>=0?'good':'bad'}">${fm(x.neto)}</td></tr>`;}).join('')}</tbody></table></div>
 <div class="tbl"><table><thead><tr><th>Fecha</th><th>Hora NY</th><th>Noticia</th><th>Dirección</th><th>Siguió</th><th class="num">Entradas</th><th class="num">Resultado</th></tr></thead><tbody>${ops.slice().reverse().slice(0,60).map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${String(o[6]||'').replace(/</g,'')}</td><td>${o[2]==='C'?'compra':'venta'}</td><td>${o[3]?'sí':'<span class="bad">no</span>'}</td><td class="num">${o[4]}</td><td class="num ${o[5]>=0?'good':'bad'}">${fm(+o[5])}</td></tr>`).join('')}</tbody></table><p class="note">Últimas 60 operaciones.</p></div>`;
 $('det').scrollIntoView({behavior:'smooth'});}
$('entrar').onclick=()=>{cfg={url:$('url').value.trim(),clave:$('clave').value};try{localStorage.setItem('panel_mentor_masfin',JSON.stringify(cfg));}catch(e){}cargar();};
$('recargar').onclick=cargar;
if(cfg.url&&cfg.clave)cargar();
})();
</script>
